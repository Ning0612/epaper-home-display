mqtt:
  broker_host: "192.168.1.100"
  broker_port: 1883
  client_id: "epaper-home-display"
  # username: ""                  # 可選：Broker 帳號（Mosquitto 啟用 password_file 時填入）
  # password: ""                  # 可選：Broker 密碼

weather:
  api_key: "your_openweathermap_api_key"
  lat: 25.05              # latitude (change via WebUI /settings or edit here)
  lon: 121.53             # longitude
  units: "metric"
  fetch_interval_seconds: 600

sensors:
  dht22:
    gpio_pin: 4
    use_mock: false
  light:
    spi_bus: 0
    spi_device: 1          # CE1 (CE0 is occupied by e-Paper display)
    adc_channel: 0
    bright_threshold: 500  # MCP3008 10-bit (0–1023)
    use_mock: false
  button:
    gpio_pins: [5, 6, 27, 22]  # [B1 dashboard, B2 alert-page, B3 trigger-alarm, B4 cancel-alarm]
    use_mock: false

display:
  model: "epd7in3e"              # 可選：epd7in3e（7 色彩色）/ epd7in5_V2（黑白）/ mock
  use_mock: false
  # dashboard_trigger_second 從型號自動推導，不需設定：
  #   epd7in3e → 40（全刷新 ~20s，lag=20s）
  #   epd7in5_V2 → 57（快速刷新 ~0.3s，lag=3s）
  dashboard_interval_minutes: 5  # Dashboard 刷新間隔（分鐘），必須是 60 的因數（1/2/3/4/5/6/10/12/15/20/30/60）
  full_refresh_every: 10         # 每 N 次更新做一次全刷新（黑白面板有意義；彩色面板每次都是全刷新）

voice:
  enabled: true
  player: "aplay"
  sounds_dir: "assets/sounds"
  volume: 80                 # 播放音量 0–100（透過 ALSA amixer sset 設定）
  alsa_mixer_control: "PCM"  # ALSA 控制項名稱（常見：PCM / Master；留空跳過音量設定）
  tts_engine: "espeak-ng"    # "espeak-ng" | "none"（none 停用 TTS 但保留預錄音檔播放）
  tts_language: "zh"         # espeak-ng voice（zh / zh-TW / en 等，需 Pi 已安裝對應語音包）
  tts_speed: 130             # 語速（words per minute，建議 110–150）

discord:
  webhook_url: ""
  notify_device_online: true      # 裝置上線時通知（含 WebUI 連結）
  notify_session_end: true        # 離開書桌時通知該時段摘要
  session_end_min_minutes: 5      # 短於此時間（分鐘）的時段不觸發通知
  notify_daily_summary: true      # 每日固定時間推送昨日統計
  daily_summary_time: "23:00"     # 每日摘要推送時間（HH:MM，依系統時區）

storage:
  db_path: "data/epaper-home-display.db"

webui:
  host: "0.0.0.0"
  port: 8000
  # password_hash and session_secret are managed automatically — do not edit manually

timezone: "Asia/Taipei"

images:
  storage_dir: "data/images"           # 圖片存放目錄
  max_count: 50                         # 最多保留圖片數量（超過時自動刪除最舊的）
  max_upload_bytes: 15728640            # 上傳大小上限（bytes，預設 15 MB）
  max_pixels: 25000000                  # 圖片像素數上限（2500 萬像素；Pi Zero 2W 記憶體限制，勿調高）
  carousel_enabled: false               # 是否啟用輪播
  carousel_interval_refreshes: 10       # 每 N 次 dashboard 刷新切換一張圖片
  carousel_mode: "sequential"           # 換圖模式：sequential（順序）/ random（隨機）

outdoor_agent:
  snapshot_url: "http://faceguard.local/snapshot"   # outdoor agent 快照端點（需在 dualcam-doorway 加入 /snapshot 路由）
  snapshot_timeout_sec: 2.5             # HTTP 請求逾時（秒）
  alert_page_enabled: true              # 是否啟用警示頁面
  alert_page_timeout_sec: 120           # 無新告警超過此秒數後自動返回 Dashboard

wifi:
  ap_ssid: "EpaperSetup"               # AP 熱點名稱（建議改為不易猜測的名稱）
  ap_password: "epaper123"             # AP 熱點密碼（至少 8 個字元，強烈建議修改預設值）
  connect_timeout: 30                  # 開機等待 WiFi 連線的秒數，超過後啟動 AP 模式
  monitor_interval: 10                 # 定期偵測 WiFi 模式的間隔（秒）
  # 注意：修改 ap_ssid/ap_password 後，需同步更新 systemd/epaper-wifi-check.service
  # 在 [Service] 區段加入：
  #   Environment=EPAPER_AP_SSID=你的SSID
  #   Environment=EPAPER_AP_PASS=你的密碼

claude_usage:
  creds_path: "data/claude_creds.json"   # OAuth token 儲存路徑（.gitignored，不要 commit）
  poll_interval_seconds: 600              # 每 10 分鐘向 Anthropic API 拉取一次用量
  # 初次授權：在筆電執行 python tools/claude_auth.py，授權後 scp data/claude_creds.json 到 Pi

codex_usage:
  creds_path: "data/codex_creds.json"    # OAuth token 儲存路徑（.gitignored，不要 commit）
  poll_interval_seconds: 600              # 每 10 分鐘向 OpenAI WHAM API 拉取一次用量
  # 初次授權：在筆電執行 python tools/codex_auth.py，授權後 scp data/codex_creds.json 到 Pi
  # 注意：access_token 約 1 小時後過期；若 Pi log 出現 401 請重新執行 codex_auth.py 並重新 scp

